name: copybot-tick

# Forward-tests copying vetted traders. tick (detect fresh buys) is fast; resolve
# (settle/mark) is bounded per run. Self-healing — missed runs lose nothing.
on:
  schedule:
    - cron: "11 * * * *"   # two offset triggers so a dropped GitHub run never leaves a
    - cron: "41 * * * *"   # full-hour gap; concurrency queues them for near-continuous cover
  workflow_dispatch: {}

permissions:
  contents: write

# Every workflow that PUSHES to main must share one concurrency group, otherwise
# two jobs can publish at the same time and one of them loses the push race.
# (Previously this group was `copybot` while paper-trader-tick used `tick`, so the
# two writers were not coordinated at all.)
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  copybot:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Carry the live SQLite (open copies + decisions + per-trader bankrolls) across
      # scheduled runs without committing the binary to git history. Cache is ephemeral
      # but perfect here: the bot is self-healing on new trades, and worst-case a cache
      # miss just restarts the forward test from the current activity stream.
      - name: Restore copybot state (DB)
        uses: actions/cache/restore@v4
        with:
          path: copybot.db
          key: copybot-db-${{ github.run_id }}
          restore-keys: |
            copybot-db-

      - name: tick + flush dashboard every ~9 min (resolve + claude + export + publish)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "copybot"
          git config user.email "bot@users.noreply.github.com"
          # Publication is done by publish_dashboard.py: it fetches the CURRENT
          # origin/main tip, rebuilds the dashboard commit on top of it and pushes.
          # It never rebases/merges/force-pushes, so the old
          # "CONFLICT (content): Merge conflict in docs/data.json" loop is gone, and a
          # run that was queued for an hour can no longer fail to publish.
          flush(){
            timeout 200 python3 copybot.py resolve || true
            timeout 200 python3 copybot.py claude_decide || true
            python3 copybot.py export || true
            # Only publish the tiny human-readable dashboard payload. DB lives in cache.
            if ! python3 publish_dashboard.py docs/data.json docs/quality.json \
                   --message "copybot $(date -u +%FT%TZ)"; then
              echo "::error::flush: failed to publish dashboard commit"
              echo "publication_failed=1" >> "$GITHUB_ENV"
            fi
          }
          for i in $(seq 1 10); do
            echo "--- tick $i/10 ($(date -u +%T)) ---"
            python3 copybot.py tick || true
            [ $((i % 3)) -eq 0 ] && flush      # flush dashboard every 3 ticks (~9 min)
            [ "$i" -lt 10 ] && sleep 180
          done
          flush
          python3 copybot.py report || true

      - name: Save copybot state (DB) for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: copybot.db
          key: copybot-db-${{ github.run_id }}

      - name: Check dashboard publication status
        if: always()
        run: |
          if [ "${{ env.publication_failed }}" = "1" ]; then
            echo "::error::One or more dashboard flushes failed to publish to origin/main. Check workflow logs."
            exit 1
          fi
