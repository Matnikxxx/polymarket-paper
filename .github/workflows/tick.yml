name: paper-trader-tick

# GitHub's cron can run a few minutes late, so we fire several slots around the
# strategy's :46 and :53 targets. The dedupe guard in paper_trader.py makes sure
# the same market is never bet twice, so overlapping/late runs are harmless.
on:
  schedule:
    - cron: "7,37 * * * *"   # backfill is self-healing, so exact timing no longer matters
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write   # so the job can publish any tracked change it produced

concurrency:
  # Shared with copybot.yml: any workflow that pushes to main must use the same
  # group, otherwise two writers can race and one push is rejected.
  group: main-writer
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: backfill from price history (self-healing) + report
        run: |
          python3 paper_trader.py backfill 48
          python3 paper_trader.py report
      - name: persist results
        run: |
          git config user.name "polymarket-bot"
          git config user.email "bot@users.noreply.github.com"
          # trades.db is no longer committed (see .gitignore + cache pattern in copybot.yml).
          # The original fade-the-favorite experiment is largely concluded; this workflow
          # is kept for backfill + occasional report runs only. State is ephemeral per run
          # or can be re-derived via `paper_trader.py backfill`.
          #
          # NOTE: the old version tested `git diff --staged --quiet` without ever running
          # `git add`, so it ALWAYS reported "no change" - the commit/push branch below was
          # dead code (and `git push` on a detached HEAD would have failed anyway). Stage
          # tracked modifications explicitly, then publish with the same rebase-free helper
          # copybot uses.
          git add --update
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then
            echo "no tracked file changed this run - nothing to publish"
            exit 0
          fi
          echo "publishing: $changed"
          # shellcheck disable=SC2086
          python3 publish_dashboard.py $changed --message "tick $(date -u +%FT%TZ)"
